name: Build and release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.423"

      - name: Restore
        shell: pwsh
        run: dotnet restore .\MWDA.Control.sln

      - name: Test
        shell: pwsh
        run: dotnet test .\MWDA.Control.sln --configuration Release --no-restore --filter "Category!=LiveAdapter"

  publish:
    name: Publish Windows executable
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.423"

      - name: Restore
        shell: pwsh
        run: dotnet restore .\MWDA.Control.sln --runtime win-x64

      - name: Publish single executable
        shell: pwsh
        run: >
          dotnet publish .\src\Mwda.Control\Mwda.Control.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output .\artifacts\publish\win-x64

      - name: Verify single-file output
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\publish\win-x64'
          $files = @(Get-ChildItem -LiteralPath $publishDir -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'MWDA-Control.exe') {
            $files | Select-Object Name, Length | Format-Table
            throw 'The publish directory must contain exactly MWDA-Control.exe.'
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mwda-Control-windows-x64
          path: artifacts/publish/win-x64/MWDA-Control.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" ".\artifacts\publish\win-x64\MWDA-Control.exe" --repo "$env:GITHUB_REPOSITORY" --title "MWDA Control $env:GITHUB_REF_NAME" --generate-notes
